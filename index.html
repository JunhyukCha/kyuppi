  --shell-hi: #ffe6ed;
  --ink: #3a2e3a;
  --ink-soft: #85707c;
  --lcd: #e4efd8;
  --cream: #fff8ef;
  --bell: #ff6f98;
  --bell-deep: #d33f6c;
  --warn: #e0577f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background-color: var(--shell);
  background-image: radial-gradient(rgba(255,255,255,.35) 1px, transparent 1.4px);
  background-size: 9px 9px;
  color: var(--ink);
  font-family: 'Galmuri11', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; }

.shell {
  height: 100dvh; max-width: 440px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px);
}

/* 머리글 */
.top { display: flex; align-items: center; gap: 10px; }
.title { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
.title h1 { margin: 0; font-family: 'Galmuri11Bold', 'Galmuri11', sans-serif; font-size: 24px; letter-spacing: -0.5px; }
.title span { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.love { display: flex; align-items: center; gap: 5px; font-size: 15px; font-family: 'Galmuri11Bold', 'Galmuri11', sans-serif; }
.love img { width: 18px; height: auto; }
.icon-btn {
  border: 0; background: var(--cream); border-radius: 12px; padding: 7px 10px; font-size: 13px;
  box-shadow: 0 3px 0 var(--shell-deep);
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shell-deep); }

/* 상태 게이지 */
.meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.meter { display: flex; flex-direction: column; gap: 4px; align-items: center; font-size: 12px; }
.meter .bar { display: flex; gap: 2px; }
.meter .bar i { width: 11px; height: 9px; background: rgba(58,46,58,.14); display: block; }
.meter .bar i.on { background: var(--ink); }
.meter.low .bar i.on { background: var(--warn); }
.meter.low { color: var(--warn); }

/* 화면 */
.screen-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.bezel {
  background: var(--shell-deep); border-radius: 26px; padding: 10px;
  box-shadow: inset 0 3px 0 rgba(0,0,0,.08), 0 2px 0 var(--shell-hi);
}
.screen { position: relative; border-radius: 12px; overflow: hidden; background: var(--lcd); touch-action: none; }
.screen canvas { display: block; }
.bubble {
  position: absolute; left: 50%; bottom: 60%; transform: translateX(-50%) translateY(4px);
  max-width: 86%; width: max-content;
  background: #fff; color: var(--ink); border-radius: 14px; padding: 8px 12px 7px;
  font-size: 16px; line-height: 1.35; text-align: center; word-break: keep-all;
  box-shadow: 0 2px 0 rgba(58,46,58,.22);
  opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none;
}
.bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.bubble::after {
  content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px;
  border: 7px solid transparent; border-bottom: 0; border-top-color: #fff;
}
.talk-btn {
  position: absolute; top: 8px; left: 8px; border: 0; background: var(--cream); border-radius: 12px;
  padding: 6px 10px 5px 8px; font-size: 13px; display: flex; align-items: center; gap: 5px;
  box-shadow: 0 3px 0 var(--shell-deep);
}
.talk-btn img { width: 17px; height: auto; }
.talk-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shell-deep); }
.screen.playing .talk-btn { display: none; }
.lv {
  border: 0; border-radius: 999px; padding: 4px 9px 3px; font-size: 12px; white-space: nowrap; color: var(--ink);
  background: linear-gradient(90deg, #ffd0de var(--p, 0%), var(--cream) var(--p, 0%));
  box-shadow: 0 2px 0 var(--shell-deep);
}
.chat { height: min(84dvh, 700px); display: flex; flex-direction: column; padding: 14px 14px calc(env(safe-area-inset-bottom) + 12px); }
.chat-head { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px dashed #e8d8cc; }
.chat-head img { width: 38px; height: 38px; border-radius: 12px; background: var(--lcd); }
.chat-head div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.chat-head b { font-family: 'Galmuri11Bold', 'Galmuri11', sans-serif; font-weight: normal; font-size: 16px; }
.chat-head small { font-size: 12px; color: var(--ink-soft); }
.chat-log { flex: 1; overflow-y: auto; padding: 12px 2px; display: flex; flex-direction: column; gap: 5px; -webkit-overflow-scrolling: touch; }
.msg { display: flex; gap: 6px; align-items: flex-start; max-width: 84%; }
.msg.him { align-self: flex-start; }
.msg.her { align-self: flex-end; }
.msg .b { padding: 8px 11px 7px; border-radius: 14px; font-size: 15px; line-height: 1.4; word-break: keep-all; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.msg.him .b { background: #fff; box-shadow: 0 1px 0 #eadfd2; border-top-left-radius: 4px; }
.msg.her .b { background: var(--bell); color: #fff; border-top-right-radius: 4px; }
.msg img.av { width: 30px; height: 30px; border-radius: 10px; background: var(--lcd); flex: none; }
.msg.typing .b { color: var(--ink-soft); letter-spacing: 2px; }
.chips {
  display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 8px 2px 10px; min-height: 46px;
  max-height: 148px; overflow-y: auto; scrollbar-width: thin; overscroll-behavior: contain;
}
.chat-tabs { display: flex; gap: 4px; padding-top: 8px; }
.chat-tabs[hidden] { display: none; }
.chat-tabs button { border: 0; background: transparent; padding: 6px 11px 5px; border-radius: 10px; font-size: 13px; color: var(--ink-soft); }
.chat-tabs button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 2px 0 #eadfd2; }
.chips-hint { font-size: 13px; color: var(--ink-soft); padding: 8px 2px; line-height: 1.5; }
.chip { flex: none; border: 0; background: #fff; border-radius: 999px; padding: 8px 12px 7px; font-size: 13px; box-shadow: 0 2px 0 #eadfd2; }
.chip.choice { background: #ffd0de; }
.chip.ghost { background: transparent; box-shadow: inset 0 0 0 1.5px #e8d8cc; }
.chip:active { transform: translateY(1px); }
.chips.busy .chip { opacity: .45; pointer-events: none; }
.chat-input { display: flex; gap: 6px; }
.chat-input input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 2px solid #e8d8cc;
  background: #fff; color: var(--ink); -webkit-user-select: text; user-select: text;
}
.chat-input input:focus { outline: none; border-color: var(--bell); }
.send { border: 0; background: var(--ink); color: #fff; border-radius: 12px; padding: 0 15px; font-size: 14px; }
.grow-now { background: #fff; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 2px 0 #eadfd2; }
.grow-now b { font-family: 'Galmuri11Bold', 'Galmuri11', sans-serif; font-weight: normal; font-size: 18px; }
.grow-now small { font-size: 12px; color: var(--ink-soft); }
.gbar { height: 10px; background: #f3e8de; border-radius: 5px; overflow: hidden; }
.gbar i { display: block; height: 100%; background: var(--bell); width: 0; }
.grow-list { list-style: none; margin: 12px 0 0; padding: 0; max-height: 38dvh; overflow-y: auto; }
.grow-list li { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px dashed #e8d8cc; font-size: 14px; align-items: baseline; }
.grow-list li span { flex: none; width: 122px; white-space: nowrap; font-family: 'Galmuri11Bold', 'Galmuri11', sans-serif; }
.grow-list li p { margin: 0; font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
.grow-list li.locked { opacity: .5; }
.grow-list li.now span { color: var(--bell-deep); }
.food:disabled { opacity: .45; }
.food small { font-size: 11px; color: var(--ink-soft); }
.switch:disabled { opacity: .4; }
.row.stack { flex-direction: column; align-items: stretch; gap: 8px; }
.title h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn.gear { padding: 6px 8px 4px; }
.icon-btn.gear img { width: 18px; height: auto; display: block; }
.ward { max-height: 88dvh; display: flex; flex-direction: column; }
.ward-top { display: flex; gap: 14px; align-items: center; margin-bottom: 4px; }
.ward-top canvas { width: 96px; height: 96px; image-rendering: pixelated; background: var(--lcd); border-radius: 16px; flex: none; }
.ward-top h2 { margin: 0 0 6px; }
.ward-top p { margin: 0; font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
.ward-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; padding: 10px 2px 4px; overflow-y: auto; min-height: 0; }
.wcard { border: 0; background: #fff; border-radius: 14px; padding: 8px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-size: 12px; box-shadow: 0 2px 0 #eadfd2; text-align: center; word-break: keep-all; }
.wcard img { width: 64px; height: 64px; image-rendering: pixelated; border-radius: 10px; background: var(--lcd); }
.wcard[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bell), 0 2px 0 #eadfd2; }
.wcard:disabled { opacity: .5; }
.wcard small { font-size: 11px; color: var(--ink-soft); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 0; background: #fff; border-radius: 10px; padding: 8px 11px 7px; font-size: 13px; box-shadow: 0 2px 0 #eadfd2; }
.seg button[aria-checked="true"] { background: var(--bell); color: #fff; box-shadow: 0 2px 0 var(--bell-deep); }
.seg button:disabled { opacity: .45; }
.letter-paper { background: #fffdf6; border-radius: 14px; padding: 18px 18px 16px; white-space: pre-wrap; line-height: 1.8; font-size: 15px;
  box-shadow: 0 2px 0 #eadfd2; max-height: 56dvh; overflow-y: auto; background-image: repeating-linear-gradient(transparent 0 26px, #f3e3dc 26px 27px); background-position: 0 14px; }
.grow-letter { margin-top: 12px; width: 100%; border: 0; background: #ffd0de; border-radius: 12px; padding: 12px; font-size: 15px; }
.dance-btn {
  position: absolute; top: 8px; right: 8px; border: 0; background: var(--cream); border-radius: 12px;
  padding: 6px 10px 5px 8px; font-size: 13px; display: flex; align-items: center; gap: 5px;
  box-shadow: 0 3px 0 var(--shell-deep);
}
.dance-btn img { width: 15px; height: auto; }
.dance-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shell-deep); }
.dance-btn.off { opacity: .55; filter: grayscale(.7); }
.dance-btn.ready img { animation: bop 1.1s ease-in-out infinite; }
@keyframes bop { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg) translateY(-1px); } }
.screen.playing .dance-btn { display: none; }
.hud {
  position: absolute; left: 8px; right: 8px; bottom: 6px; display: none; justify-content: space-between;
  font-size: 14px; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.7);
}
.hud.show { display: flex; }

/* 행동 버튼 */
.actions { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.act {
  border: 0; background: var(--cream); border-radius: 16px; padding: 8px 2px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: 0 4px 0 var(--shell-deep); font-size: 12px; white-space: nowrap;
}
.act img { width: 30px; height: auto; }
.act:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shell-deep); }

/* 벨 */
.bell-area { display: flex; align-items: center; justify-content: center; gap: 14px; padding-top: 2px; }
.bell {
  width: 82px; height: 82px; border-radius: 50%; border: 5px solid var(--cream);
  background: radial-gradient(circle at 38% 30%, #ffb3c9 0 14%, var(--bell) 15% 100%);
  box-shadow: 0 7px 0 var(--bell-deep), 0 9px 0 rgba(58,46,58,.12);
  display: grid; place-items: center; flex: none;
}
.bell img { width: 34px; height: auto; }
.bell:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--bell-deep), 0 3px 0 rgba(58,46,58,.12); }
.bell.ring img { animation: ring .5s ease; }
@keyframes ring { 20% { transform: rotate(-16deg); } 45% { transform: rotate(14deg); } 70% { transform: rotate(-8deg); } }
.bell-text { display: flex; flex-direction: column; gap: 5px; }
.bell-text b { font-family: 'Galmuri11Bold', 'Galmuri11', sans-serif; font-size: 16px; font-weight: normal; }
.bell-text small { font-size: 12px; color: var(--ink-soft); min-height: 1.3em; }

/* 시트 */
.sheet-back {
  position: fixed; inset: 0; background: rgba(58,46,58,.35); display: none; align-items: flex-end; justify-content: center; z-index: 10;
}
.sheet-back.show { display: flex; }
.sheet {
  width: 100%; max-width: 440px; background: var(--cream); border-radius: 22px 22px 0 0;
  padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px);
  animation: up .2s ease-out;
}
@keyframes up { from { transform: translateY(30px); opacity: .5; } }
.sheet h2 { margin: 0 0 14px; font-size: 18px; font-family: 'Galmuri11Bold', 'Galmuri11', sans-serif; font-weight: normal; }
.foods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.foods.four { grid-template-columns: repeat(4, 1fr); }
.food {
  border: 0; background: #fff; border-radius: 14px; padding: 10px 2px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px;
  box-shadow: 0 3px 0 #eadfd2; word-break: keep-all; text-align: center;
}
.food img { width: 40px; height: auto; }
.food:active { transform: translateY(2px); box-shadow: 0 1px 0 #eadfd2; }
.sheet .close {
  margin-top: 14px; width: 100%; border: 0; background: var(--shell-hi); border-radius: 12px; padding: 12px; font-size: 15px;
}
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px dashed #e8d8cc; font-size: 15px; }
.row:last-of-type { border-bottom: 0; }
.row p { margin: 4px 0 0; font-size: 12px; color: var(--ink-soft); line-height: 1.5; word-break: break-all; }
.switch {
  width: 52px; height: 30px; border-radius: 15px; border: 0; background: #e3d6cb; position: relative; flex: none;
}
.switch::after {
  content: ''; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #fff;
  transition: left .15s;
}
.switch[aria-checked="true"] { background: var(--bell); }
.switch[aria-checked="true"]::after { left: 26px; }
.text-btn { border: 0; background: var(--shell-hi); border-radius: 10px; padding: 9px 12px; font-size: 13px; flex: none; }
.text-btn.danger { background: #ffe0e0; color: #b23a3a; }
.name-edit { display: flex; gap: 6px; }
.name-edit input {
  width: 128px; font: inherit; font-size: 16px; padding: 8px 10px; border-radius: 10px;
  border: 2px solid #e8d8cc; background: #fff; color: var(--ink); -webkit-user-select: text; user-select: text;
}
.name-edit input:focus { outline: none; border-color: var(--bell); }
.debug { display: none; gap: 6px; flex-wrap: wrap; padding-top: 10px; }
.debug.show { display: flex; }

.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; width: max-content; max-width: 90%;
}
.toast.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .bell.ring img, .sheet, .dance-btn.ready img { animation: none; }
  .bubble { transition: none; }
}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="title"><h1 id="nameTitle">큐삐</h1><button class="lv" id="lvBtn">Lv.1 아기</button></div>
    <div class="love" aria-label="애정도"><img class="px" data-icon="heart" alt=""><span id="love">0</span></div>
    <button class="icon-btn" id="wardBtn">옷장</button>
    <button class="icon-btn gear" id="settingsBtn" aria-label="설정"><img class="px" data-icon="iconGear" alt=""></button>
  </header>

  <section class="meters" aria-label="큐삐 상태">
    <div class="meter" id="m-full"><span>배부름</span><div class="bar"></div></div>
    <div class="meter" id="m-clean"><span>깨끗함</span><div class="bar"></div></div>
    <div class="meter" id="m-energy"><span>기운</span><div class="bar"></div></div>
    <div class="meter" id="m-fun"><span>기분</span><div class="bar"></div></div>
  </section>

  <section class="screen-wrap" id="screenWrap">
    <div class="bezel">
      <div class="screen" id="screen" aria-label="큐삐 화면. 큐삐를 누르면 쓰다듬을 수 있어요">
        <canvas id="lcd"></canvas>
        <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
        <button class="talk-btn" id="talkBtn"><img class="px" data-icon="iconTalk" alt="">대화하기</button>
        <button class="dance-btn" id="danceBtn"><img class="px" data-icon="note" alt="">춤추기</button>
        <div class="hud" id="hud"><span id="hudScore"></span><span id="hudTime"></span></div>
      </div>
    </div>
  </section>

  <nav class="actions" aria-label="돌보기">
    <button class="act" id="btnFeed"><img class="px" data-icon="iconFood" alt="">밥주기</button>
    <button class="act" id="btnPoop"><img class="px" data-icon="iconPoop" alt="">응아하기</button>
    <button class="act" id="btnBath" aria-label="목욕시키기"><img class="px" data-icon="iconBath" alt="">목욕</button>
    <button class="act" id="btnSleep"><img class="px" data-icon="iconSleep" alt=""><span>재우기</span></button>
    <button class="act" id="btnPlay"><img class="px" data-icon="iconPlay" alt="">놀아주기</button>
    <button class="act" id="btnTouch"><img class="px" data-icon="iconButt" alt="">장난치기</button>
  </nav>

  <section class="bell-area">
    <button class="bell" id="bellBtn" aria-label="보고싶을 때 누르는 벨. 누르면 오빠 폰으로 알림이 가요"><img class="px" data-icon="bellIcon" alt=""></button>
    <div class="bell-text">
      <b>보고싶을 때 누르는 벨</b>
      <small id="bellStatus">누르면 오빠 폰이 울려</small>
    </div>
  </section>
</main>

<div class="sheet-back" id="foodBack">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="foodTitle">
    <h2 id="foodTitle">뭐 먹일까?</h2>
    <div class="foods" id="foods"></div>
    <button class="close" data-close>닫기</button>
  </div>
</div>

<div class="sheet-back" id="touchBack">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="touchTitle">
    <h2 id="touchTitle">어떻게 할까?</h2>
    <div class="foods four" id="touches">
      <button class="food" data-touch="pet"><img class="px" data-icon="iconPet" alt="">쓰다듬기</button>
      <button class="food" data-touch="butt"><img class="px" data-icon="iconButt" alt="">엉덩이 만지기</button>
      <button class="food" data-touch="tease"><img class="px" data-icon="iconTease" alt="">괴롭히기</button>
      <button class="food" data-touch="shy"><img class="px" data-icon="iconShy" alt="">거기 쓰다듬기</button>
    </div>
    <button class="close" data-close>닫기</button>
  </div>
</div>

<div class="sheet-back" id="chatBack">
  <div class="sheet chat" role="dialog" aria-modal="true" aria-labelledby="chatTitle">
    <header class="chat-head">
      <img class="px" id="chatAvatar" alt="">
      <div><b id="chatTitle">큐삐</b><small id="chatStatus">온라인</small></div>
      <button class="text-btn" data-close>닫기</button>
    </header>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="chat-tabs" id="chatTabs" role="tablist" aria-label="대화 종류">
      <button type="button" role="tab" data-tab="say" aria-selected="true">말하기</button>
      <button type="button" role="tab" data-tab="ask" aria-selected="false">물어보기</button>
      <button type="button" role="tab" data-tab="memory" aria-selected="false">추억</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="sheet-back" id="growBack">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="growTitle">
    <h2 id="growTitle">성장 일기</h2>
    <div class="grow-now">
      <b id="growNow">Lv.1 아기 큐삐</b>
      <small id="growDays">함께한 지 1일째</small>
      <div class="gbar"><i id="growBar"></i></div>
      <small id="growNext"></small>
    </div>
    <ol class="grow-list" id="growList"></ol>
    <button class="grow-letter" id="growLetter" hidden>큐삐의 편지 읽기</button>

function drawBody(g, arms = 'down') {
  // 목
  hline(g, 23, 14, 17, 's');

    24: 'NNNNNNNNNNNN', // x10..21
    25: 'NNNCCCCCCCCNNN', // x9..22
    26: 'NNNCCCCCCCCCNN',
    27: 'NNCCCCCCCCCCNN',
    28: '..CCCCCCCCCC..',
    29: '..cCCCCCCCCc..',
  };
  const startX = { 23: 11, 24: 10, 25: 9, 26: 9, 27: 9, 28: 9, 29: 9 };
  for (const [y, row] of Object.entries(rows)) {
    [...row].forEach((c, i) => { if (c !== '.') put(g, startX[y] + i, +y, c); });
  }
  // 카라 라인
  hline(g, 24, 13, 18, 'n'); put(g, 13, 23, 'n'); put(g, 18, 23, 'n');

  put(g, 9, 27, 'n'); put(g, 22, 27, 'n');
  const up = arms === 'up' ? [0, 1] : arms === 'upL' ? [0] : arms === 'upR' ? [1] : [];

  if (arms === 'down' || up.length === 1) {
    for (const side of [0, 1]) if (!up.includes(side)) { put(g, mir(side, 9), 28, 'S'); put(g, mir(side, 10), 28, 'S'); }
  }
  if (arms === 'cover') {
    // 두 손으로 앞을 가림
    for (const [x, y, c] of [[11, 27, 'N'], [12, 28, 'N'], [13, 29, 'S'], [14, 29, 'S'], [15, 29, 'S'], [16, 29, 'S'], [17, 29, 'S'], [18, 29, 'S'], [19, 28, 'N'], [20, 27, 'N'], [13, 30, 'S'], [18, 30, 'S']]) put(g, x, y, c);
    put(g, 15, 30, 's'); put(g, 16, 30, 's');

  for (const side of up) {
    for (const [x, y] of [[9, 26], [10, 26], [9, 27], [10, 27], [9, 25]]) put(g, mir(side, x), y, '.');
    put(g, mir(side, 10), 26, 'N'); put(g, mir(side, 10), 27, 'C');

  // 바지/발

  hline(g, 31, 11, 14, 'g'); hline(g, 31, 17, 20, 'g');
}

function recolorDenim(g) {

  for (let y = 23; y < 30; y++) for (let x = 0; x < W32; x++) if (map[g[y][x]]) g[y][x] = map[g[y][x]];
}
const OUTFIT_FX = {

}

function drawCrown(g) {
  for (const x of [12, 15, 16, 19]) put(g, x, 0, 'Z');
  hline(g, 1, 12, 19, 'Z'); hline(g, 2, 12, 19, 'Z'); hline(g, 3, 12, 19, 'z');
  put(g, 15, 2, 'R'); put(g, 16, 2, 'R'); put(g, 13, 2, 'T'); put(g, 18, 2, 'T');
}

function drawClip(g) {
  hline(g, 6, 11, 16, 'P');
  put(g, 10, 7, 'P'); hline(g, 7, 11, 15, 'p'); put(g, 16, 7, 'P');
  hline(g, 8, 11, 16, 'P');
}

function outline(g) {
  const o = g.map(r => r.slice());
  for (let y = 0; y < H32; y++) for (let x = 0; x < W32; x++) {
    if (g[y][x] !== '.') continue;
    const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
      const nx = x + dx, ny = y + dy;
      return nx >= 0 && nx < W32 && ny >= 0 && ny < H32 && g[ny][nx] !== '.';
    });
    if (n) o[y][x] = 'O';
  }
  return o;
}

function buildKyuppi(opts = {}) {
  const { eyes = 'open', mouth = 'neutral', arms = 'down', blush = true, clip = false, outfit = 'raglan', headgear = 'none', ring = false, glasses = false } = opts;
  const g = blank();
  drawBody(g, arms);
  if (outfit === 'denim') recolorDenim(g);
  if (outfit === 'uniform') recolorUniform(g);
  if (OUTFIT_FX[outfit]) OUTFIT_FX[outfit](g);
  if (ring && g[28][21] === 'S') put(g, 21, 28, 'Z');
  drawHead(g);
  (EYES[eyes] || EYES.open)(g);
  (MOUTHS[mouth] || MOUTHS.neutral)(g);
  if (blush) drawBlush(g, blush === 'big');
  if (glasses) drawGlasses(g);
  if (clip) drawClip(g);
  if (headgear === 'headset') drawHeadset(g);
  if (headgear === 'crown') drawCrown(g);
  if (headgear === 'frog') drawFrog(g);
  if (headgear === 'rabbit') drawRabbit(g);
  if (headgear === 'cat') drawCatEars(g);
  if (headgear === 'maidBand') drawMaidBand(g);
  if (headgear === 'beanie') drawBeanie(g);
  return outline(g);
}

function tick(now) {
  const s = state;
  let t = s.lastTick;
  if (!(now > t)) { s.lastTick = now; return; }
  while (t < now) {
    const step = Math.min(now - t, 10 * MIN);
    const h = step / HOUR;
    if (s.asleep) {
      s.full = clamp(s.full - 2.5 * h);
      s.energy = clamp(s.energy + 14 * h);
      s.clean = clamp(s.clean - (1 + 2 * s.poops) * h);
      // 밤(22시~7시)에는 기운이 다 차도 아침까지 계속 잔다. 낮잠은 기운이 다 차면 깬다.
      if (s.energy >= 100 && !isSleepTime(new Date(t + step))) { s.asleep = false; s.justWoke = true; }
    } else {
      s.full = clamp(s.full - 6 * h);
      s.fun = clamp(s.fun - 5 * h);
      s.energy = clamp(s.energy - 4 * h);
      s.clean = clamp(s.clean - (2 + 3 * s.poops) * h);
    }
    t += step;
    // 응아 신호가 오고 45분 동안 화장실에 못 가면 바닥에..
    s.poopQueue = s.poopQueue.filter(due => {
      if (t >= due + 45 * MIN) { s.poops = Math.min(3, s.poops + 1); s.clean = clamp(s.clean - 8); s.newFloorPoop = true; return false; }
      return true;
    });
    if (s.full <= 3 || s.fun <= 3) { if (!s.sulk) s.sulkCare = 0; s.sulk = true; }
  }
  s.lastTick = now;
}

const spriteCache = new Map();
function gridCanvas(grid, pal) {
  const h = grid.length, w = grid[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
    const ch = grid[yy][xx];
    if (ch !== '.' && pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(xx, yy, 1, 1); }
  }
  return c;
}
function kyuppi(opts) {
  const key = JSON.stringify(opts);
  if (!spriteCache.has(key)) spriteCache.set(key, gridCanvas(buildKyuppi(opts).map(r => r.join ? r.join('') : r), PAL));
  return spriteCache.get(key);
}
function item(name) {
  const key = 'item:' + name;
  if (!spriteCache.has(key)) spriteCache.set(key, gridCanvas(ITEMS[name], ITEM_PAL));

let actx = null;
function beep(freq = 660, dur = 0.08, type = 'square', vol = 0.035, when = 0) {
  if (!state.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    const t = actx.currentTime + when;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* 소리 미지원 */ }
}

const game = { active: false, t0: 0, dur: 20000, score: 0, px: 16, target: 16, items: [], nextSpawn: 0, last: 0 };

}
function endGame() {
  game.active = false; $('hud').classList.remove('show'); $('screen').classList.remove('playing');
  const s = state; const win = game.score >= 12;
  s.fun = clamp(s.fun + (win ? 35 : 20)); s.energy = clamp(s.energy - 12); s.full = clamp(s.full - 6);
  addLove(win ? 3 : 1); care();
  startAnim(win ? 'cheer' : 'sad', 2200);
  say((win ? pick(LINES.playWin) : pick(LINES.playLose)) + '  (' + game.score + '점)', 3200);
  win ? sfx.happy() : sfx.sad();

}
function renderGame(now) {
  const dt = Math.min(0.05, (now - game.last) / 1000); game.last = now;
  const el = now - game.t0;
  if (el >= game.dur) { endGame(); return; }
  drawRoom(now);
  // 이동
  const diff = game.target - game.px;
  game.px += Math.sign(diff) * Math.min(Math.abs(diff), 70 * dt);
  game.px = Math.max(-8, Math.min(LW - 24, game.px));
  // 생성
  if (now > game.nextSpawn) {
    const r = Math.random();
    const kind = r < 0.58 ? 'heart' : r < 0.8 ? 'pasta' : 'paper';
    game.items.push({ kind, x: rand(2, LW - 12), y: -10, vy: rand(16, 22) + el / 1000 * 1.1 });
    game.nextSpawn = now + Math.max(330, 620 - el / 50);
  }
  const cx = Math.round(game.px), cy = LH - 34;
  for (let i = game.items.length - 1; i >= 0; i--) {
    const it = game.items[i];
    it.y += it.vy * dt;
    const w = ITEMS[it.kind][0].length, h = ITEMS[it.kind].length;
    const hit = it.y + h > cy + 2 && it.y < cy + 16 && it.x + w > cx + 5 && it.x < cx + 27;
    if (hit) {
      game.items.splice(i, 1);
      if (it.kind === 'paper') { game.score = Math.max(0, game.score - 2); say(pick(LINES.work), 1200); sfx.bad(); }
      else { game.score += it.kind === 'pasta' ? 2 : 1; spawn('sparkle', it.x, it.y, 0, -8, 500); sfx.catch(); }
      continue;
    }
    if (it.y > LH) { game.items.splice(i, 1); continue; }
    bx.drawImage(item(it.kind), Math.round(it.x), Math.round(it.y));
  }
  const moving = Math.abs(diff) > 1;
  bx.drawImage(kyuppi(Object.assign({ eyes: 'open', mouth: moving ? 'o' : 'smile', arms: 'up' }, wear())), cx, cy);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1000;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    bx.drawImage(item(p.name), Math.round(p.x), Math.round(p.y));
  }
  $('hudScore').textContent = '점수 ' + game.score;
  $('hudTime').textContent = Math.ceil((game.dur - el) / 1000) + '초';
}
function screenPointer(e) {
  const r = lcd.getBoundingClientRect();
  const lxp = (e.clientX - r.left) / r.width * LW, lyp = (e.clientY - r.top) / r.height * LH;
  return { x: lxp, y: lyp };
}
$('screen').addEventListener('pointerdown', e => {
  const p = screenPointer(e);
  if (game.active) { game.target = p.x - 16; e.preventDefault(); return; }
  // 캐릭터 영역 터치 = 쓰다듬기
  if (p.x >= charPos.x + 3 && p.x <= charPos.x + 29 && p.y >= charPos.y && p.y <= charPos.y + 32) pet();
});
$('screen').addEventListener('pointermove', e => {
  if (!game.active || !(e.buttons || e.pointerType === 'touch')) return;
  game.target = screenPointer(e).x - 16;
});

// ---------- 벨 (ntfy) ----------
const bell = { pending: 0, timer: 0, sending: false, lastSent: 0 };
function setBellStatus(t) { $('bellStatus').textContent = t; }
function pressBell() {
  bell.pending++;
  const b = $('bellBtn'); b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring');
  sfx.bell();
  if (!state.asleep && !game.active) { startAnim('cheer', 1400); say(pick(LINES.bell), 2400); }
  setBellStatus(bell.pending + '번 누름');
  clearTimeout(bell.timer);
  const wait = Math.max(1500, 8000 - (Date.now() - bell.lastSent));
  bell.timer = setTimeout(sendBell, wait);
}
async function sendBell() {
  if (bell.sending) { bell.timer = setTimeout(sendBell, 1500); return; }
  const n = bell.pending; if (!n) return;
  bell.pending = 0; bell.sending = true;
  setBellStatus('오빠 폰으로 보내는 중..');
  const message = n === 1 ? '쟈기가 보고싶대! 연락해줘' : '쟈기가 벨을 ' + n + '번 눌렀어!! 얼른 연락해줘';
  try {
    const res = await fetch(CONFIG.ntfyServer + '/', {
      method: 'POST',
      body: JSON.stringify({ topic: CONFIG.ntfyTopic, title: state.name + ' 긴급호출', message, priority: 5, tags: ['bell', 'two_hearts'] }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    bell.lastSent = Date.now(); state.bells += n; save();
    setBellStatus('보냈어! 오빠 폰이 울렸을 거야');
    toast('오빠 폰으로 벨을 보냈어');
  } catch (e) {
    setBellStatus('못 보냈어. 인터넷 연결 확인하고 다시 눌러줘');
    toast('벨을 못 보냈어. 인터넷 연결을 확인해줘');
  } finally { bell.sending = false; }
}

// ---------- UI ----------
let toastTimer = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400); }

function updateUI() {
  const s = state;
  for (const [id, v] of [['m-full', s.full], ['m-clean', s.clean], ['m-energy', s.energy], ['m-fun', s.fun]]) {
    const el = $(id); const on = Math.ceil(v / 20);
    el.classList.toggle('low', v < 25);
    el.querySelector('.bar').innerHTML = Array.from({ length: 5 }, (_, i) => '<i class="' + (i < on ? 'on' : '') + '"></i>').join('');
    el.setAttribute('aria-label', el.firstElementChild.textContent + ' ' + Math.round(v) + '%');
  }
  $('love').textContent = s.love;
  $('nameTitle').textContent = s.name; document.title = s.name;
  const L = LEVELS[s.level - 1], N = LEVELS[s.level];
  const pct = N ? Math.round((s.love - L.need) / (N.need - L.need) * 100) : 100;
  const lb = $('lvBtn'); lb.textContent = 'Lv.' + s.level + ' ' + L.title; lb.style.setProperty('--p', pct + '%');
  lb.setAttribute('aria-label', '성장 일기 열기. 지금 Lv.' + s.level + ' ' + L.title + (N ? ', 다음 성장까지 애정도 ' + (N.need - s.love) : ''));

  const sb = $('btnSleep');
  sb.querySelector('span').textContent = s.asleep ? '깨우기' : '재우기';
  sb.querySelector('img').src = icons[s.asleep ? 'iconWake' : 'iconSleep'];
  const ok = canDance(); const db = $('danceBtn');
  db.classList.toggle('ready', ok); db.classList.toggle('off', !ok);
  db.setAttribute('aria-label', ok ? '춤추기' : '춤추기 (기분이 좋을 때만 춰요)');
  $('swSound').setAttribute('aria-checked', String(!!s.sound));
}

const icons = {};
function initIcons() {
  for (const n of ['iconFood', 'iconPoop', 'iconBath', 'iconSleep', 'iconWake', 'iconPlay', 'heart', 'bellIcon', 'iconButt', 'iconPet', 'iconTease', 'iconShy', 'note', 'iconTalk', 'iconGear']) icons[n] = iconURL(n, 4);
  document.querySelectorAll('img[data-icon]').forEach(img => { img.src = icons[img.dataset.icon]; });
  for (const f of FOODS) icons['food:' + f.key] = iconURL(f.key, 4);
  icons.lock = iconURL('iconLock', 4);
}
function renderFoods() {
  $('foods').innerHTML = FOODS.map((f, i) => {
    const open = !f.lv || has(f.lv);
    return '<button class="food" data-food="' + i + '"' + (open ? '' : ' disabled aria-label="' + f.name + ', Lv.' + f.lv + '에 열려"') + '><img class="px" src="' + (open ? icons['food:' + f.key] : icons.lock) + '" alt="">' + (open ? f.name : '<small>Lv.' + f.lv + '에 열려</small>') + '</button>';
  }).join('');
}
function renderGrowth() {
  const s = state, L = LEVELS[s.level - 1], N = LEVELS[s.level];
  $('growNow').textContent = 'Lv.' + s.level + ' ' + stageName();
  $('growDays').textContent = '함께한 지 ' + (Math.floor((Date.now() - s.createdAt) / 86400000) + 1) + '일째, 애정도 ' + s.love;
  $('growBar').style.width = (N ? Math.round((s.love - L.need) / (N.need - L.need) * 100) : 100) + '%';
  $('growNext').textContent = N ? '다음 성장(' + N.title + ')까지 애정도 ' + (N.need - s.love) + ' 남았어' : '다 컸어! 만렙 달성';
  $('growLetter').hidden = !has(8);
  $('growList').innerHTML = LEVELS.map(x => '<li class="' + (x.lv === s.level ? 'now' : x.lv > s.level ? 'locked' : '') + '"><span>Lv.' + x.lv + ' ' + x.title + '</span><p>' + x.unlock + (x.lv > s.level ? ' (애정도 ' + x.need + ')' : '') + '</p></li>').join('');
}

let lastFocus = null;
function openSheet(id) {
  lastFocus = document.activeElement;
  $(id).classList.add('show');
  const first = $(id).querySelector('button'); if (first) first.focus();
}
function closeSheets() {
  document.querySelectorAll('.sheet-back.show').forEach(el => el.classList.remove('show'));
  resetArm = false; $('resetBtn').textContent = '초기화'; $('resetHint').textContent = '지금까지의 기록이 모두 지워져.';
  if (lastFocus) lastFocus.focus();
}

let resetArm = false;
function bind() {
  $('btnFeed').onclick = () => { if (asleepBlock()) return; if (game.active) return; renderFoods(); openSheet('foodBack'); };
  $('btnPoop').onclick = () => { if (!game.active) toilet(); };
  $('btnBath').onclick = () => { if (!game.active) bath(); };
  $('btnSleep').onclick = () => { if (!game.active) toggleSleep(); };
  $('btnPlay').onclick = () => { if (!game.active) startGame(); };
  $('btnTouch').onclick = () => { if (!game.active) openSheet('touchBack'); };
  $('touches').onclick = e => { const b = e.target.closest('[data-touch]'); if (b) doTouch(b.dataset.touch); };
  $('bellBtn').onclick = pressBell;
  $('talkBtn').addEventListener('pointerdown', e => e.stopPropagation());
  $('talkBtn').onclick = openChat;
  $('chatTabs').onclick = e => { const t = e.target.closest('[data-tab]'); if (t) { chat.tab = t.dataset.tab; renderChips(); } };
  $('lvBtn').onclick = () => { renderGrowth(); openSheet('growBack'); };
  $('wardBtn').onclick = () => { renderWardrobe(); openSheet('wardBack'); };
  $('wardTabs').onclick = e => { const t = e.target.closest('[data-tab]'); if (t) { wardTab = t.dataset.tab; renderWardrobe(); } };
  $('wardGrid').onclick = e => { const b = e.target.closest('[data-id]'); if (b && !b.disabled) wardPick(b.dataset.id); };
  $('growLetter').onclick = () => { closeSheets(); $('letterText').textContent = LETTER; openSheet('letterBack'); };
  $('danceBtn').addEventListener('pointerdown', e => e.stopPropagation());
  $('danceBtn').onclick = dance;
  $('settingsBtn').onclick = () => { $('nameInput').value = state.name; openSheet('settingsBack'); };
  const saveName = () => {
    const v = $('nameInput').value.trim().slice(0, 8) || '큐삐';
    $('nameInput').blur();
    if (v === state.name) return closeSheets();
    state.name = v; afterAction(); closeSheets();
    toast('이름을 ' + withRo(v) + ' 바꿨어');
    startAnim('cheer', 1600); say('이제 ' + v + josa(v, '이야', '야') + '! 히히', 3000); sfx.happy();
  };
  $('nameSave').onclick = saveName;
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveName(); } });
  $('foods').onclick = e => { const b = e.target.closest('[data-food]'); if (b && !b.disabled) feed(FOODS[+b.dataset.food]); };
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheets);
  document.querySelectorAll('.sheet-back').forEach(back => back.addEventListener('click', e => { if (e.target === back) closeSheets(); }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheets(); });
  $('swSound').onclick = () => { state.sound = !state.sound; afterAction(); };
  $('resetBtn').onclick = () => {
    if (!resetArm) { resetArm = true; $('resetBtn').textContent = '정말 초기화'; $('resetHint').textContent = '한 번 더 누르면 처음부터 다시 시작해.'; return; }
    const keepName = state.name; state = freshState(Date.now()); state.name = keepName; save(); closeSheets(); updateUI(); say(introLines()[0], 3000);
  };
  $('topicName').textContent = CONFIG.ntfyTopic;
  if (/[?&]debug/.test(location.search)) {
    $('debug').classList.add('show');
    document.querySelectorAll('[data-ff]').forEach(b => b.onclick = () => fastForward(+b.dataset.ff * HOUR));
    $('dbgPoop').onclick = () => { state.poopQueue.push(Date.now() - MIN); afterAction(); };
  }
  window.addEventListener('resize', layout);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { state.lastVisit = Date.now(); save(); }
    else { const away = Date.now() - state.lastVisit; tick(Date.now()); greet(away); updateUI(); save(); }
  });
}
function fastForward(ms) {
  state.lastTick -= ms; state.lastVisit -= ms; state.createdAt -= ms;
  state.poopQueue = state.poopQueue.map(d => d - ms);
  tick(Date.now()); save(); updateUI(); toast(Math.round(ms / HOUR) + '시간 지남');
}

function greet(away) {
  const s = state; const now = Date.now(); const h = new Date().getHours();
  if (s.newFloorPoop && s.poops > 0) { s.newFloorPoop = false; startAnim('sad', 1800); return say(pick(LINES.poopFloor), 3000); }
  if (s.justWoke) { s.justWoke = false; s.lastMorning = dayKey(now); return say(pick(LINES.morning), 3000); }
  if (s.asleep) return say(pick(LINES.sleeping), 2400);
  if (h >= 5 && h < 12 && s.lastMorning !== dayKey(now)) { s.lastMorning = dayKey(now); return say(pick(LINES.morning), 3000); }
  if (away > 8 * HOUR) return say(pick(LINES.returnLong), 3200);
  if (away > 30 * MIN) return say(pick(LINES.hello), 2600);
}

// ---------- 시작 ----------
function boot() {
  const now = Date.now();
  const saved = load();
  initIcons(); bind();
  if (saved && saved.v === 1) {
    state = Object.assign(freshState(now), saved);
    state.level = Math.max(state.level || 1, levelOf(state.love));
    if (state.headgear === 'fox') state.headgear = 'frog';
    if (!Array.isArray(state.chat)) state.chat = [];
    const away = now - state.lastVisit;
    tick(now); greet(away);
  } else {
    state = freshState(now);
    say(introLines()[0], 3000); setTimeout(() => say(introLines()[1], 3000), 3200);
  }
  state.lastVisit = now; save();
  layout(); updateUI();
  let lastFrame = 0, lastTickAt = performance.now(), nextChat = performance.now() + rand(9000, 14000);
  function loop(t) {
    requestAnimationFrame(loop);
    if (!game.active && t - lastFrame < 66) return;
    lastFrame = t;
    if (t - lastTickAt > 10000) {
      lastTickAt = t;
      tick(Date.now());
      if (state.newFloorPoop) { state.newFloorPoop = false; startAnim('sad', 1800); say(pick(LINES.poopFloor)); }
      if (state.justWoke) { state.justWoke = false; state.lastMorning = dayKey(Date.now()); say(pick(LINES.morning)); }
      state.lastVisit = Date.now(); save(); updateUI();
    }
    if (t > nextChat) { nextChat = t + rand(14000, 24000); if (Date.now() - lastSpoke > 8000) chatter(); }
    render(t);
  }
  requestAnimationFrame(loop);
}
boot();
</script>
