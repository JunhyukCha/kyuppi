<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7cad6">
<meta name="robots" content="noindex">
<title>큐삐 기록 내보내기</title>
<style>
  /* 게임과 같은 색. 이 페이지는 이 브라우저에 저장된 큐삐 기록을 읽기만 한다 (지우거나 바꾸지 않음) */
  :root { --shell: #f7cad6; --shell-hi: #ffe6ed; --shell-deep: #e29db3; --cream: #fff8ef; --ink: #3a2e3a; --ink-soft: #85707c; --bell: #ff6f98; --bell-deep: #d33f6c; --lcd: #e4efd8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--shell); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; display: grid; place-items: center; padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)); }
  main { width: min(100%, 420px); background: var(--cream); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--shell-deep); padding: 24px 22px 22px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 18px; color: var(--ink-soft); font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
  .stats li { background: var(--lcd); border-radius: 12px; padding: 10px 12px; }
  .stats b { display: block; font-size: 20px; line-height: 1.2; }
  .stats span { font-size: 12px; color: var(--ink-soft); }
  button { width: 100%; font: inherit; font-weight: 700; border: 3px solid var(--ink); border-radius: 14px; padding: 13px 16px; margin-top: 10px; cursor: pointer; }
  .main-btn { background: var(--bell); color: #fff; box-shadow: 0 4px 0 var(--bell-deep); }
  .sub-btn { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--shell-deep); }
  button:active { transform: translateY(3px); box-shadow: none; }
  button:focus-visible { outline: 3px solid var(--bell-deep); outline-offset: 3px; }
  .steps { margin: 20px 0 0; padding-left: 20px; font-size: 14px; color: var(--ink-soft); }
  .steps li + li { margin-top: 4px; }
  .msg { min-height: 1.6em; margin: 12px 0 0; font-size: 14px; text-align: center; }
  .empty { background: var(--shell-hi); border-radius: 12px; padding: 14px; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }
</style>
</head>
<body>
<main>
  <h1>큐삐 기록 내보내기</h1>
  <p class="lead">이 브라우저에 있는 큐삐 기록을 파일로 저장해서 큐삐 앱으로 옮겨.</p>
  <div id="found" hidden>
    <ul class="stats">
      <li><b id="sLevel">-</b><span>레벨</span></li>
      <li><b id="sLove">-</b><span>애정도</span></li>
      <li><b id="sCoins">-</b><span>코인</span></li>
      <li><b id="sAlbum">-</b><span>앨범 사진</span></li>
    </ul>
    <button class="main-btn" id="saveBtn" type="button">파일로 저장하기</button>
    <button class="sub-btn" id="copyBtn" type="button">글자로 복사하기</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <ol class="steps">
      <li>"파일로 저장하기"를 누르면 다운로드 폴더에 저장돼.</li>
      <li>큐삐 앱 게임 화면 오른쪽 위 설정 → "웹 버전 기록 가져오기"에서 그 파일을 골라.</li>
      <li>옮긴 뒤엔 앱에서 이어서 하면 돼. 여기 기록은 그대로 남아.</li>
    </ol>
  </div>
  <p class="empty" id="none" hidden>이 브라우저에는 큐삐 기록이 없어. 평소에 큐삐를 하던 그 브라우저로 이 주소를 열어 줘.</p>
</main>
<script>
'use strict';
// 게임이 쓰는 저장 키. 채팅 비밀번호(kyuppi-chat-pw)는 일부러 넣지 않는다
const KEYS = ['kyuppi-save-v1', 'kyuppi-album'];
const $ = id => document.getElementById(id);
const data = {};
for (const k of KEYS) { try { const v = localStorage.getItem(k); if (v != null) data[k] = v; } catch (e) { /* 읽기 불가 */ } }
let save = null;
try { save = JSON.parse(data['kyuppi-save-v1'] || 'null'); } catch (e) { save = null; }
if (!save) {
  $('none').hidden = false;
} else {
  $('found').hidden = false;
  let album = [];
  try { album = JSON.parse(data['kyuppi-album'] || '[]') || []; } catch (e) { album = []; }
  const num = n => (Number(n) || 0).toLocaleString('ko-KR');
  $('sLevel').textContent = 'Lv.' + (save.level || 1);
  $('sLove').textContent = num(save.love);
  $('sCoins').textContent = num(save.coins);
  $('sAlbum').textContent = (Array.isArray(album) ? album.length : 0) + '장';
  // 큐삐가 카톡으로 배운 대화 묶음도 같이 (게임 페이지에 들어 있는 암호화된 그대로. 비밀번호는 넣지 않는다)
  let backup = JSON.stringify({ format: 'kyuppi-web-backup', v: 1, at: new Date().toISOString(), data });
  const ready = fetch('index.html', { cache: 'no-store' }).then(r => r.text()).then(html => {
    const m = html.match(/^const CHATDB = (\{.*\});$/m);
    if (m) { JSON.parse(m[1]); data['kyuppi-chatdb'] = m[1]; backup = JSON.stringify({ format: 'kyuppi-web-backup', v: 1, at: new Date().toISOString(), data }); }
  }).catch(() => { /* 대화 묶음 없이도 저장은 된다 (앱이 웹에서 다시 받아 온다) */ });
  const msg = t => { $('msg').textContent = t; };
  $('saveBtn').onclick = async () => {
    await ready;
    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const name = `kyuppi-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
    const url = URL.createObjectURL(new Blob([backup], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    msg(name + '으로 저장했어');
  };
  $('copyBtn').onclick = async () => {
    await ready;
    try { await navigator.clipboard.writeText(backup); msg('복사했어. 앱에서 붙여넣어 줘'); }
    catch (e) { msg('복사가 안 돼. "파일로 저장하기"를 써 줘'); }
  };
  ready.then(() => { if (backup.length > 800000) $('copyBtn').hidden = true; }); // 사진이 많으면 클립보드에 안 들어가서 파일만
}
</script>
</body>
</html>
